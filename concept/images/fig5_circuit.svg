<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2937">電気回路で自作する場合: 1 段ぶんの信号の流れと部品の例</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#4b5563">「A ／ B」と並べた型番は、低周波版（〜100 kHz）／ 高周波版（1〜20 MHz）の順の例。型番は目安で、データシートでの確認が必要</text>

  <!-- signal chain -->
  <rect x="20" y="78" width="960" height="250" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="38" y="102" font-size="15" font-weight="bold" fill="#1e3a8a">信号の流れ（この 1 段を 8〜16 回つなぐ）</text>

  <g font-size="13" fill="#111827" text-anchor="middle">
    <rect x="36" y="128" width="130" height="92" rx="8" fill="#fdf2f8" stroke="#db2777"/>
    <text x="101" y="150" font-weight="bold">入力（FSK）</text>
    <text x="101" y="172">文字 → 周波数</text>
    <text x="101" y="192" font-size="12">AD9833 ／</text>
    <text x="101" y="208" font-size="12">AD9959 の 1 ch</text>

    <rect x="196" y="128" width="140" height="92" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="266" y="150" font-weight="bold">① 位相の板</text>
    <text x="266" y="172">掛け算（ミキサ）</text>
    <text x="266" y="192" font-size="12">AD633 ／ AD835</text>
    <text x="266" y="208" font-size="12">（SA612 でも可）</text>

    <rect x="366" y="128" width="130" height="92" rx="8" fill="#ffffff" stroke="#2563eb"/>
    <text x="431" y="150" font-weight="bold">帯域通過</text>
    <text x="431" y="172">不要な成分を除く</text>
    <text x="431" y="192" font-size="12">OP アンプ</text>
    <text x="431" y="208" font-size="12">TL072 ／ AD8065</text>

    <rect x="526" y="128" width="160" height="92" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="606" y="150" font-weight="bold">② 回折の代わり</text>
    <text x="606" y="172">2 次全域通過フィルタ</text>
    <text x="606" y="192" font-size="12">OP アンプ＋R・C、微調整は</text>
    <text x="606" y="208" font-size="12">MCP4131 ／ 可変容量</text>

    <rect x="716" y="128" width="110" height="92" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-dasharray="5 4"/>
    <text x="771" y="166" font-weight="bold">次の段へ</text>
    <text x="771" y="190" font-size="12">（8〜16 段）</text>

    <rect x="846" y="128" width="120" height="92" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="906" y="150" font-weight="bold">③④ 検出</text>
    <text x="906" y="172" font-size="12">帯域通過 ＋ 実効値</text>
    <text x="906" y="190" font-size="12">LTC1968 ／ AD8361</text>
    <text x="906" y="208" font-size="12">または ADC: AD9226</text>
  </g>
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M166 174 H192" marker-end="url(#ar)"/>
    <path d="M336 174 H362" marker-end="url(#ar)"/>
    <path d="M496 174 H522" marker-end="url(#ar)"/>
    <path d="M686 174 H712" marker-end="url(#ar)"/>
    <path d="M826 174 H842" marker-end="url(#ar)"/>
  </g>

  <!-- LO from DDS -->
  <rect x="166" y="252" width="200" height="60" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="266" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">A·sin(ωt＋φ) を作る（DDS）</text>
  <text x="266" y="296" text-anchor="middle" font-size="12" fill="#92400e">AD9959（4 ch、振幅・位相を設定）</text>
  <path d="M266 252 V224" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="386" y="286" font-size="12" fill="#374151">区画ごとに A と φ を切り替える（学習した値）</text>

  <!-- support -->
  <rect x="20" y="344" width="960" height="236" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="38" y="368" font-size="15" font-weight="bold" fill="#111827">周りの部品（設定・時計・較正・電源）</text>
  <g font-size="13" fill="#111827">
    <rect x="36" y="384" width="220" height="180" rx="8" fill="#ffffff" stroke="#6b7280"/>
    <text x="146" y="408" text-anchor="middle" font-weight="bold">設定役（制御ボード）</text>
    <text x="50" y="434">・KV260 ／ Red Pitaya</text>
    <text x="50" y="454">　／ Raspberry Pi Pico 2</text>
    <text x="50" y="478">・SPI で DDS と可変抵抗へ</text>
    <text x="50" y="498">・ADC の値を読む</text>
    <text x="50" y="522">・Ethernet・USB で PC へ</text>
    <text x="50" y="542">　（SSH・Python から操作）</text>

    <rect x="276" y="384" width="220" height="180" rx="8" fill="#ffffff" stroke="#6b7280"/>
    <text x="386" y="408" text-anchor="middle" font-weight="bold">基準の時計</text>
    <text x="290" y="434">・10 MHz の TCXO</text>
    <text x="290" y="454">　（温度補償水晶発振器）</text>
    <text x="290" y="478">・Si5351 で各部へ分配</text>
    <text x="290" y="502">・全 DDS を同じ時計で動かし</text>
    <text x="290" y="522">　位相をそろえる</text>

    <rect x="516" y="384" width="220" height="180" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <text x="626" y="408" text-anchor="middle" font-weight="bold" fill="#4c1d95">較正</text>
    <text x="530" y="434">・DDS で周波数を掃引</text>
    <text x="530" y="454">・各段の試験端子を</text>
    <text x="530" y="474">　アナログスイッチで選ぶ</text>
    <text x="530" y="494">　（ADG1608 など）</text>
    <text x="530" y="518">・ADC で群遅延を測り</text>
    <text x="530" y="538">　学習の模型に戻す</text>

    <rect x="756" y="384" width="210" height="180" rx="8" fill="#ffffff" stroke="#6b7280"/>
    <text x="861" y="408" text-anchor="middle" font-weight="bold">電源・基板</text>
    <text x="770" y="434">・低雑音 LDO（LT3045）</text>
    <text x="770" y="454">・±5 V、アナログと</text>
    <text x="770" y="474">　デジタルのグランド分離</text>
    <text x="770" y="498">・4 層基板、SMA 端子</text>
    <text x="770" y="518">・金属のシールド</text>
    <text x="770" y="538">・温度センサ（TMP117）</text>
  </g>
</svg>

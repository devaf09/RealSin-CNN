<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="980" height="470" fill="#ffffff"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">同じ学習器を、4 種類の「波の装置」で作れる</text>
  <!-- header -->
  <g font-size="16" font-weight="bold" fill="#ffffff">
    <rect x="20" y="58" width="150" height="44" fill="#4b5563"/><text x="95" y="86" text-anchor="middle">部品の役割</text>
    <rect x="175" y="58" width="190" height="44" fill="#2563eb"/><text x="270" y="86" text-anchor="middle">① 位相の板（学習）</text>
    <rect x="370" y="58" width="190" height="44" fill="#7c3aed"/><text x="465" y="86" text-anchor="middle">② 回折（固定）</text>
    <rect x="565" y="58" width="190" height="44" fill="#db2777"/><text x="660" y="86" text-anchor="middle">③ レンズ（固定）</text>
    <rect x="760" y="58" width="200" height="44" fill="#059669"/><text x="860" y="86" text-anchor="middle">④ 検出（読む）</text>
  </g>
  <g font-size="14" fill="#111827">
    <!-- rows -->
    <rect x="20" y="108" width="150" height="76" fill="#f3f4f6"/><text x="95" y="140" text-anchor="middle" font-weight="bold">光</text><text x="95" y="162" text-anchor="middle" font-size="12">（元の模型）</text>
    <rect x="175" y="108" width="190" height="76" fill="#eff6ff"/><text x="270" y="140" text-anchor="middle">液晶の位相変調器</text><text x="270" y="162" text-anchor="middle">（SLM）</text>
    <rect x="370" y="108" width="190" height="76" fill="#f5f3ff"/><text x="465" y="140" text-anchor="middle">板と板の間の</text><text x="465" y="162" text-anchor="middle">空間を進む</text>
    <rect x="565" y="108" width="190" height="76" fill="#fdf2f8"/><text x="660" y="150" text-anchor="middle">レンズ</text>
    <rect x="760" y="108" width="200" height="76" fill="#ecfdf5"/><text x="860" y="140" text-anchor="middle">カメラ・受光素子</text><text x="860" y="162" text-anchor="middle">の明るさ</text>

    <rect x="20" y="190" width="150" height="76" fill="#f3f4f6"/><text x="95" y="222" text-anchor="middle" font-weight="bold">電波・電気</text><text x="95" y="244" text-anchor="middle" font-size="12">（位置 → 時間）</text>
    <rect x="175" y="190" width="190" height="76" fill="#eff6ff"/><text x="270" y="222" text-anchor="middle">位相を回した発振 ×</text><text x="270" y="244" text-anchor="middle">ミキサー</text>
    <rect x="370" y="190" width="190" height="76" fill="#f5f3ff"/><text x="465" y="222" text-anchor="middle">全域通過フィルタ</text><text x="465" y="244" text-anchor="middle">1 段（周波数で遅れが違う）</text>
    <rect x="565" y="190" width="190" height="76" fill="#fdf2f8"/><text x="660" y="222" text-anchor="middle">周波数ごとに分ける</text><text x="660" y="244" text-anchor="middle">（フィルタバンク）</text>
    <rect x="760" y="190" width="200" height="76" fill="#ecfdf5"/><text x="860" y="222" text-anchor="middle">2 乗検波（RMS 検出）</text><text x="860" y="244" text-anchor="middle">＋ 積分</text>

    <rect x="20" y="272" width="150" height="76" fill="#f3f4f6"/><text x="95" y="304" text-anchor="middle" font-weight="bold">音・振動</text><text x="95" y="326" text-anchor="middle" font-size="12">（構想）</text>
    <rect x="175" y="272" width="190" height="76" fill="#eff6ff"/><text x="270" y="304" text-anchor="middle">送波器ごとの</text><text x="270" y="326" text-anchor="middle">遅れ（位相）の設定</text>
    <rect x="370" y="272" width="190" height="76" fill="#f5f3ff"/><text x="465" y="304" text-anchor="middle">空間・導波路を</text><text x="465" y="326" text-anchor="middle">伝わって広がる</text>
    <rect x="565" y="272" width="190" height="76" fill="#fdf2f8"/><text x="660" y="304" text-anchor="middle">音響レンズ・</text><text x="660" y="326" text-anchor="middle">ビームフォーミング</text>
    <rect x="760" y="272" width="200" height="76" fill="#ecfdf5"/><text x="860" y="304" text-anchor="middle">マイク（配列）の</text><text x="860" y="326" text-anchor="middle">音の強さ</text>

    <rect x="20" y="354" width="150" height="76" fill="#f3f4f6"/><text x="95" y="386" text-anchor="middle" font-weight="bold">デジタル</text><text x="95" y="408" text-anchor="middle" font-size="12">（だめなときの代わり）</text>
    <rect x="175" y="354" width="190" height="76" fill="#eff6ff"/><text x="270" y="386" text-anchor="middle">表引き（6 bit）×</text><text x="270" y="408" text-anchor="middle">8 bit の掛け算</text>
    <rect x="370" y="354" width="190" height="76" fill="#f5f3ff"/><text x="465" y="386" text-anchor="middle">9 タップの畳み込み</text><text x="465" y="408" text-anchor="middle">（FFT 不要）</text>
    <rect x="565" y="354" width="190" height="76" fill="#fdf2f8"/><text x="660" y="386" text-anchor="middle">必要な 16 本の</text><text x="660" y="408" text-anchor="middle">周波数だけ計算</text>
    <rect x="760" y="354" width="200" height="76" fill="#ecfdf5"/><text x="860" y="386" text-anchor="middle">2 乗して足す</text><text x="860" y="408" text-anchor="middle">（FPGA の流れ作業）</text>
  </g>
  <text x="490" y="456" text-anchor="middle" font-size="13" fill="#6b7280">① だけが学習する部品。②〜④ は固定で、実機の特性を測って学習に使う（較正）ことが前提。①〜② を 8〜16 回くり返す。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="980" height="500" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">装置の組み立て: 基本部分 ＋ 差し替えられるモジュール</text>
  <!-- base -->
  <rect x="30" y="60" width="300" height="410" rx="16" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="180" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">基本部分（共通の土台）</text>
  <g font-size="14" fill="#111827">
    <rect x="50" y="110" width="260" height="56" rx="8" fill="#ffffff" stroke="#6b7280"/><text x="180" y="134" text-anchor="middle" font-weight="bold">司令塔（Linux の SoC）</text><text x="180" y="155" text-anchor="middle" font-size="12">SSH・Claude Code・実験の予約</text>
    <rect x="50" y="176" width="260" height="56" rx="8" fill="#ffffff" stroke="#6b7280"/><text x="180" y="200" text-anchor="middle" font-weight="bold">学習役（GPU / NPU）</text><text x="180" y="221" text-anchor="middle" font-size="12">勾配の計算・模擬（シミュレーション）</text>
    <rect x="50" y="242" width="260" height="56" rx="8" fill="#ffffff" stroke="#6b7280"/><text x="180" y="266" text-anchor="middle" font-weight="bold">設定役（FPGA）</text><text x="180" y="287" text-anchor="middle" font-size="12">モジュールへ値を書く・読む・時刻合わせ</text>
    <rect x="50" y="308" width="260" height="56" rx="8" fill="#ffffff" stroke="#6b7280"/><text x="180" y="332" text-anchor="middle" font-weight="bold">基準の時計・較正の信号</text><text x="180" y="353" text-anchor="middle" font-size="12">全モジュールで同じ時計を使う</text>
    <rect x="50" y="374" width="260" height="56" rx="8" fill="#ffffff" stroke="#6b7280"/><text x="180" y="398" text-anchor="middle" font-weight="bold">電源・冷却・筐体</text><text x="180" y="419" text-anchor="middle" font-size="12">モジュール用のスロット（差し込み口）</text>
  </g>
  <!-- bus -->
  <rect x="350" y="60" width="40" height="410" rx="8" fill="#fde68a" stroke="#d97706"/>
  <text x="370" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e" transform="rotate(-90 370 265)">共通の差し込み口（値・信号・時計・電源）</text>
  <!-- modules -->
  <g font-size="13" fill="#111827">
    <rect x="410" y="56" width="550" height="108" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="428" y="82" font-size="16" font-weight="bold" fill="#1e3a8a">波の計算モジュール（どれか 1 つ、または複数）</text>
    <text x="428" y="106">A. 電気の波（1 次元）: 位相を回す発振 ＋ ミキサー</text>
    <text x="428" y="124">　　＋ 全域通過フィルタ を 8〜16 段</text>
    <text x="428" y="144">B. 光の波（2 次元）: 位相の SLM ＋ レンズ ＋ カメラ</text>
    <text x="428" y="160" font-size="12" fill="#1e3a8a">C. デジタル: FPGA の 8 bit 流れ作業（アナログがだめなときの代わり）</text>

    <rect x="410" y="172" width="550" height="64" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="428" y="198" font-size="16" font-weight="bold" fill="#064e3b">検出モジュール</text>
    <text x="428" y="222">フィルタバンク ＋ 2 乗検波（16〜64 本）、または高速 ADC</text>

    <rect x="410" y="244" width="550" height="64" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <text x="428" y="270" font-size="16" font-weight="bold" fill="#831843">入力モジュール</text>
    <text x="428" y="294">文字 → 周波数（DDS）、音（マイク・多チャンネル ADC）、画像</text>

    <rect x="410" y="316" width="550" height="64" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="428" y="342" font-size="16" font-weight="bold" fill="#4c1d95">較正・計測モジュール</text>
    <text x="428" y="366">フィルタの特性を掃引信号で測る、温度を測る → 学習役へ</text>

    <rect x="410" y="388" width="550" height="82" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="428" y="414" font-size="16" font-weight="bold" fill="#92400e">ドック（① 充実仕様のみ）</text>
    <text x="428" y="438">エッジ機器の受け口: 電源・高速通信・時計合わせ</text>
    <text x="428" y="458">技能（学習した値）の同期と、エッジ機器の較正</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">波で計算する AI を、波のまま動かしたい</text>
  <!-- left: today -->
  <rect x="30" y="64" width="430" height="330" rx="14" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="245" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#374151">いま: 計算機が波を「真似」している</text>
  <rect x="60" y="120" width="110" height="56" rx="8" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="115" y="153" text-anchor="middle" font-size="15" fill="#111827">入力の波</text>
  <rect x="200" y="112" width="120" height="72" rx="8" fill="#fde68a" stroke="#b45309"/>
  <text x="260" y="142" text-anchor="middle" font-size="15" fill="#78350f">FFT で計算</text>
  <text x="260" y="164" text-anchor="middle" font-size="13" fill="#78350f">（全体の約 6〜9 割）</text>
  <rect x="350" y="120" width="90" height="56" rx="8" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="395" y="153" text-anchor="middle" font-size="15" fill="#111827">答え</text>
  <path d="M170 148 H196" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/><path d="M320 148 H346" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="260" y="222" text-anchor="middle" font-size="15" fill="#374151">板 16 枚 × FFT 2 回 × 照明・色の数</text>
  <text x="260" y="248" text-anchor="middle" font-size="15" fill="#374151">→ 同じ大きさの CNN の約 10 倍重い（2 次元版で実測）</text>
  <text x="245" y="300" text-anchor="middle" font-size="15" fill="#b91c1c">重いのは「波が広がる・集まる」計算</text>
  <text x="245" y="326" text-anchor="middle" font-size="15" fill="#b91c1c">（自然界ではタダで起きること）</text>
  <!-- right: goal -->
  <rect x="500" y="64" width="430" height="330" rx="14" fill="#ecfdf5" stroke="#10b981"/>
  <text x="715" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#065f46">目標: 本物の波に計算させる</text>
  <rect x="530" y="120" width="100" height="56" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="580" y="153" text-anchor="middle" font-size="15" fill="#064e3b">入力の波</text>
  <rect x="655" y="112" width="130" height="72" rx="8" fill="#a7f3d0" stroke="#047857"/>
  <text x="720" y="140" text-anchor="middle" font-size="15" fill="#064e3b">位相の板</text>
  <text x="720" y="162" text-anchor="middle" font-size="13" fill="#064e3b">＋ 波が進むだけ</text>
  <rect x="810" y="120" width="100" height="56" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="860" y="153" text-anchor="middle" font-size="15" fill="#064e3b">明るさ</text>
  <path d="M630 148 H651" stroke="#065f46" stroke-width="2.5" marker-end="url(#b)"/><path d="M785 148 H806" stroke="#065f46" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="715" y="222" text-anchor="middle" font-size="15" fill="#065f46">学習するのは板の「振幅と位相」だけ</text>
  <text x="715" y="248" text-anchor="middle" font-size="15" fill="#065f46">（重みの表なし・約 2,000 個・4 bit で十分）</text>
  <text x="715" y="300" text-anchor="middle" font-size="15" fill="#065f46">光・電波（RF）・音、どの波でも同じ形</text>
  <text x="715" y="326" text-anchor="middle" font-size="15" fill="#065f46">技能は「足すだけ」で融合、外せば元どおり</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#065f46"/></marker>
  </defs>
</svg>

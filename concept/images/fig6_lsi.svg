<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2937">専用 LSI の想定: 1 チップの中の区画（構想）</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#4b5563">計算量を減らす工夫は要らない。波の伝わりは「時間がかかるだけ」で、段数・経路を増やしても計算は増えない</text>

  <!-- chip outline -->
  <rect x="20" y="72" width="960" height="470" rx="18" fill="#f9fafb" stroke="#111827" stroke-width="3"/>

  <!-- digital -->
  <rect x="40" y="92" width="200" height="430" rx="12" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="140" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">デジタル区画</text>
  <g font-size="13" fill="#111827">
    <text x="54" y="148">・小さな CPU（RISC-V）</text>
    <text x="54" y="172">・値の記憶（SRAM）</text>
    <text x="54" y="190" font-size="12">　A・φ を 8〜12 bit で</text>
    <text x="54" y="206" font-size="12">　経路 64 本ぶん</text>
    <text x="54" y="232">・技能ファイルの出し入れ</text>
    <text x="54" y="258">・外との接続</text>
    <text x="54" y="276" font-size="12">　PCIe・USB・SPI</text>
    <text x="54" y="302">・時計（PLL）と</text>
    <text x="54" y="320">　全区画の時刻合わせ</text>
    <text x="54" y="346">・暗号化した保存</text>
    <text x="54" y="372">・上書きできない領域</text>
    <text x="54" y="390" font-size="12">　（生まれつきの反射）</text>
  </g>

  <!-- input -->
  <rect x="260" y="92" width="130" height="200" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="325" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#831843">入力</text>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <text x="325" y="146">文字 → 周波数</text>
    <text x="325" y="164">（数値制御発振）</text>
    <text x="325" y="192">音・センサの</text>
    <text x="325" y="210">ADC</text>
    <text x="325" y="238">GHz 帯へ</text>
    <text x="325" y="256">周波数変換</text>
  </g>

  <!-- core -->
  <rect x="410" y="92" width="370" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="595" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">波の計算コア（16〜64 段 × 並列 16〜64 経路）</text>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <rect x="426" y="134" width="104" height="70" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="478" y="156" font-weight="bold">位相変調</text>
    <text x="478" y="174">IQ 変調器</text>
    <text x="478" y="192">A・φ は DAC から</text>
    <rect x="546" y="134" width="104" height="70" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="598" y="156" font-weight="bold">分散（回折）</text>
    <text x="598" y="174">LC 全域通過の</text>
    <text x="598" y="192">多段で本来の回折</text>
    <rect x="666" y="134" width="100" height="70" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="716" y="156" font-weight="bold">微調整</text>
    <text x="716" y="174">遅れを 0.01%</text>
    <text x="716" y="192">単位で合わせる</text>
    <text x="595" y="230">1 段 = 位相変調 → 分散 → 微調整（正規化は不要）</text>
    <text x="595" y="252">融合した技能は「経路を並べる」だけ</text>
    <text x="595" y="274">専門家の選択はアナログのスイッチ（上位 2 経路）</text>
  </g>

  <!-- detect -->
  <rect x="800" y="92" width="160" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="880" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#064e3b">検出</text>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <text x="880" y="146">フィルタバンク</text>
    <text x="880" y="164">（N パス型、可変）</text>
    <text x="880" y="192">2 乗検波 ＋ 積分</text>
    <text x="880" y="220">64 本</text>
    <text x="880" y="248">ADC 10〜12 bit</text>
    <text x="880" y="266">→ デジタルへ</text>
  </g>

  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M390 190 H406" marker-end="url(#ar)"/>
    <path d="M780 190 H796" marker-end="url(#ar)"/>
    <path d="M530 169 H542" marker-end="url(#ar)"/>
    <path d="M650 169 H662" marker-end="url(#ar)"/>
  </g>

  <!-- backward -->
  <rect x="260" y="310" width="700" height="110" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="280" y="336" font-size="15" font-weight="bold" fill="#7f1d1d">学習の区画: 波を逆向きに流して勾配を求める（チップの中で学習）</text>
  <g font-size="12.5" fill="#111827">
    <text x="280" y="360">・分散は「強さを変えない」フィルタなので、時間を逆にして同じ段に通すと、誤差の逆伝播になる</text>
    <text x="280" y="380">・各段で「前向きの波 × 後ろ向きの波」を掛けて積分すると、その段の A・φ の直し方（勾配）が出る</text>
    <text x="280" y="400">・波形の一時記憶（ADC ＋ SRAM ＋ DAC）が要る。光の分野で提案されている「随伴法」と同じ考え方</text>
  </g>
  <path d="M880 296 V306" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ap)"/>
  <path d="M470 310 V296" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ap)"/>

  <!-- calibration -->
  <rect x="260" y="436" width="700" height="86" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="280" y="462" font-size="15" font-weight="bold" fill="#4c1d95">較正の区画</text>
  <g font-size="12.5" fill="#111827">
    <text x="280" y="486">・内蔵の試験信号で各段の遅れ方を測る（簡易ネットワークアナライザ）、温度センサ、自動の微調整ループ</text>
    <text x="280" y="506">・測った特性をデジタル区画に記録し、学習の区画が使う模型に反映する</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="980" height="440" fill="#ffffff"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">3 つの仕様の関係: 家で育てて、現場で動かし、持ち帰って合わせる</text>
  <!-- spec1 -->
  <rect x="30" y="70" width="380" height="270" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e3a8a">① 充実仕様（基地局）</text>
  <text x="220" y="132" text-anchor="middle" font-size="14" fill="#1e3a8a">自宅・仕事場に置く</text>
  <g font-size="14" fill="#1f2937">
    <text x="55" y="168">・最初の学習（大きなモデル、たくさんの技能）</text>
    <text x="55" y="194">・アナログの波の装置＋デジタルの代わり</text>
    <text x="55" y="220">・実機の較正（フィルタの特性を測る）</text>
    <text x="55" y="246">・エッジ機器を差し込む「ドック」を持つ</text>
    <text x="55" y="272">・将来の 2 次元・音・グレインにも余裕</text>
    <text x="55" y="298">・SSH・Claude Code で実験を自動で回す</text>
  </g>
  <!-- dock -->
  <rect x="430" y="150" width="120" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="490" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">ドック</text>
  <text x="490" y="214" text-anchor="middle" font-size="12" fill="#92400e">電源・高速通信</text>
  <text x="490" y="232" text-anchor="middle" font-size="12" fill="#92400e">時計合わせ・較正</text>
  <path d="M410 180 H426" stroke="#2563eb" stroke-width="3" marker-end="url(#m1)"/>
  <path d="M554 230 H570" stroke="#059669" stroke-width="3" marker-end="url(#m2)"/>
  <path d="M570 180 H554" stroke="#059669" stroke-width="3" marker-end="url(#m2)"/>
  <path d="M426 230 H410" stroke="#2563eb" stroke-width="3" marker-end="url(#m1)"/>
  <!-- spec3 -->
  <rect x="570" y="70" width="380" height="270" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="760" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#064e3b">③ エッジ仕様（現場）</text>
  <text x="760" y="132" text-anchor="middle" font-size="14" fill="#064e3b">持ち運ぶ・電池で動く</text>
  <g font-size="14" fill="#1f2937">
    <text x="595" y="168">・基地局で学んだ AI を動かす（推論）</text>
    <text x="595" y="194">・現場で「差分」だけを学ぶ（技能の追記）</text>
    <text x="595" y="220">・新しい技能は足すだけ、外せば元どおり</text>
    <text x="595" y="246">・低消費電力・小型・振動や衝撃に強い</text>
    <text x="595" y="272">・ドックに戻すと技能を基地局と合わせる</text>
    <text x="595" y="298">・設計の土台は mutsumi の仕様を流用</text>
  </g>
  <!-- spec2 -->
  <rect x="200" y="360" width="580" height="64" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="490" y="388" text-anchor="middle" font-size="17" font-weight="bold" fill="#4c1d95">② 低コスト仕様（約 5 万円）＝ ① の格下げ版</text>
  <text x="490" y="410" text-anchor="middle" font-size="13" fill="#4c1d95">手元の PC を学習役にして、波の装置はデジタル（FPGA）＋ アナログ 1 層の試作だけ</text>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
  </defs>
</svg>
